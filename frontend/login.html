<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVault - Login / Signup</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main class="centered">
      <section class="section auth-page">
        <h2>Login / Signup</h2>
        <div class="auth-forms">
          <div id="login-card" class="auth-card">
            <h3>Login</h3>
            <input id="login-username" placeholder="Username" />
            <input id="login-password" type="password" placeholder="Password" />
            <button id="login-button">Login</button>
            <p class="muted">
              Don't have an account?
              <a id="show-signup-link" href="#">Sign up</a>
            </p>
          </div>
          <div id="signup-card" class="auth-card" style="display: none">
            <h3>Signup</h3>
            <input id="signup-username" placeholder="Username" />
            <input
              id="signup-password"
              type="password"
              placeholder="Password"
            />
            <button id="signup-button">Create account</button>
            <p class="muted">
              Have an account? <a id="show-login-link" href="#">Login</a>
            </p>
          </div>
        </div>
        <p><a href="index.html">Back to Home</a></p>
      </section>
    </main>

    <script src="scripts/app.js"></script>
  </body>
</html>
